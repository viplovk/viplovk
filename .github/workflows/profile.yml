name: Profile

on:
  push:
    paths:
      - '.github/workflows/profile.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: write
  issues: read

jobs:
  stats:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          user = os.environ['GITHUB_REPOSITORY_OWNER']
          headers = {'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          repos = get(f'https://api.github.com/users/{user}/repos?per_page=100&type=owner')
          public_repos = sum(1 for r in repos if not r.get('private'))
          stars = sum(r.get('stargazers_count', 0) for r in repos)
          forks = sum(r.get('forks_count', 0) for r in repos)

          langs = {}
          for repo in repos:
              try:
                  data = get(f"https://api.github.com/repos/{user}/{repo['name']}/languages")
                  for lang, amount in data.items():
                      langs[lang] = langs.get(lang, 0) + amount
              except Exception as e:
                  print(f"Skipping {repo['name']}: {e}")

          top = sorted(langs.items(), key=lambda x: x[1], reverse=True)[:6]
          total = sum(v for _, v in top) or 1

          accent = '#88C0D0'
          text = '#C9D1D9'
          muted = '#6E7681'
          border = '#30363D'

          stats = f'''<svg xmlns="http://www.w3.org/2000/svg" width="495" height="190" viewBox="0 0 495 190">
          <rect width="495" height="190" rx="12" fill="#0D1117" stroke="{border}"/>
          <text x="25" y="38" fill="{accent}" font-family="Arial,sans-serif" font-size="20" font-weight="700">GitHub Statistics</text>
          <line x1="25" y1="55" x2="470" y2="55" stroke="{border}"/>
          <text x="30" y="92" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="25" font-weight="700">{public_repos}</text>
          <text x="30" y="112" fill="{muted}" font-family="Arial,sans-serif" font-size="11">PUBLIC REPOS</text>
          <text x="175" y="92" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="25" font-weight="700">{stars}</text>
          <text x="175" y="112" fill="{muted}" font-family="Arial,sans-serif" font-size="11">STARS</text>
          <text x="315" y="92" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="25" font-weight="700">{forks}</text>
          <text x="315" y="112" fill="{muted}" font-family="Arial,sans-serif" font-size="11">FORKS</text>
          <text x="30" y="153" fill="{text}" font-family="Arial,sans-serif" font-size="12">Profile</text>
          <text x="82" y="153" fill="{accent}" font-family="Arial,sans-serif" font-size="12" font-weight="700">github.com/{user}</text>
          </svg>'''

          rows = ''
          for i, (lang, amount) in enumerate(top):
              pct = amount / total * 100
              y = 73 + i * 18
              width = max(4, 300 * pct / 100)
              rows += f'''<text x="25" y="{y}" fill="{text}" font-family="Arial,sans-serif" font-size="11">{lang}</text>
              <rect x="105" y="{y-9}" width="300" height="6" rx="3" fill="#21262D"/>
              <rect x="105" y="{y-9}" width="{width:.1f}" height="6" rx="3" fill="{accent}"/>
              <text x="455" y="{y}" fill="{muted}" font-family="Arial,sans-serif" font-size="10" text-anchor="end">{pct:.1f}%</text>'''

          top_langs = f'''<svg xmlns="http://www.w3.org/2000/svg" width="495" height="190" viewBox="0 0 495 190">
          <rect width="495" height="190" rx="12" fill="#0D1117" stroke="{border}"/>
          <text x="25" y="38" fill="{accent}" font-family="Arial,sans-serif" font-size="20" font-weight="700">Top Languages</text>
          <line x1="25" y1="55" x2="470" y2="55" stroke="{border}"/>
          {rows}
          </svg>'''

          Path('profile').mkdir(exist_ok=True)
          Path('profile/stats.svg').write_text(stats, encoding='utf-8')
          Path('profile/top-langs.svg').write_text(top_langs, encoding='utf-8')
          PY

      - name: Commit stats
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/stats.svg profile/top-langs.svg
          git diff --cached --quiet || git commit -m '📊 update profile stats'
          git push

  guestbook:
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.number == 1 && github.event.issue.pull_request == null }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update guestbook
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json, os, re, urllib.request
          from datetime import datetime

          token = os.environ['GH_TOKEN']
          owner, repo = os.environ['GITHUB_REPOSITORY'].split('/')
          headers = {'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}

          req = urllib.request.Request(
              f'https://api.github.com/repos/{owner}/{repo}/issues/1/comments?per_page=100',
              headers=headers
          )
          with urllib.request.urlopen(req) as r:
              comments = json.load(r)

          comments.sort(key=lambda x: x.get('updated_at',''), reverse=True)
          comments = comments[:10]

          def esc(s):
              return str(s).replace('&','&amp;').replace('<','&lt;').replace('>','&gt;').replace('"','&quot;').replace("'",'&#039;')

          def truncate(s, n=180):
              return s if len(s) <= n else s[:n] + '...'

          rows = []
          for c in comments:
              user = esc(c['user']['login'])
              avatar = c['user']['avatar_url']
              profile = c['user']['html_url']
              message = esc(c.get('body','')).replace('|','&#124;').replace('\r\n','<br>').replace('\n','<br>').replace('\r','<br>')
              message = truncate(message)
              date = datetime.fromisoformat(c['updated_at'].replace('Z','+00:00')).strftime('%d %b %Y')
              rows.append(f'<tr><td align="center"><a href="{profile}"><img src="{avatar}" width="32" height="32" alt="{user}"><br><b>{user}</b></a></td><td align="center">{date}</td><td>{message}</td></tr>')

          if not rows:
              rows.append('<tr><td align="center">✦</td><td align="center">—</td><td><i>Be the first to leave a message.</i></td></tr>')

          table = '<table>\n<tr><th width="25%">NAME</th><th width="20%">DATE</th><th width="55%">MESSAGE</th></tr>\n' + '\n'.join(rows) + '\n</table>'

          with open('README.md', encoding='utf-8') as f:
              readme = f.read()

          pattern = r'<!-- Guestbook -->[\s\S]*?<!-- /Guestbook -->'
          if not re.search(pattern, readme):
              raise SystemExit('Guestbook markers not found')

          updated = re.sub(pattern, '<!-- Guestbook -->\n\n' + table + '\n\n<!-- /Guestbook -->', readme, count=1)

          with open('README.md','w',encoding='utf-8') as f:
              f.write(updated)
          PY

      - name: Commit guestbook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --quiet || git commit -m '✦ update guestbook'
          git push
