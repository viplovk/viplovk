name: Profile

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

  issue_comment:
    types:
      - created
      - edited
      - deleted

permissions:
  contents: write
  issues: read

jobs:

  # ================================================================
  # GITHUB STATS
  # ================================================================

  stats:
    name: Generate GitHub Stats
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile statistics
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |

            const fs = require("fs");

            const username = context.repo.owner;

            // --------------------------------------------------------
            // FETCH USER
            // --------------------------------------------------------

            const user = await github.rest.users.getByUsername({
              username
            });

            const userData = user.data;

            // --------------------------------------------------------
            // FETCH REPOSITORIES
            // --------------------------------------------------------

            const repos = await github.paginate(
              github.rest.repos.listForUser,
              {
                username,
                per_page: 100,
                type: "owner",
                sort: "updated"
              }
            );

            // --------------------------------------------------------
            // CALCULATE STATS
            // --------------------------------------------------------

            let stars = 0;
            let forks = 0;

            for (const repo of repos) {
              stars += repo.stargazers_count || 0;
              forks += repo.forks_count || 0;
            }

            const totalRepos = repos.length;

            // --------------------------------------------------------
            // CALCULATE LANGUAGES
            // --------------------------------------------------------

            const languages = {};

            for (const repo of repos) {

              try {

                const response =
                  await github.rest.repos.listLanguages({
                    owner: repo.owner.login,
                    repo: repo.name
                  });

                for (const [language, bytes] of Object.entries(
                  response.data
                )) {

                  languages[language] =
                    (languages[language] || 0) + bytes;

                }

              } catch (error) {

                console.log(
                  `Could not read languages for ${repo.name}`
                );

              }
            }

            const sortedLanguages =
              Object.entries(languages)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 6);

            const totalBytes =
              sortedLanguages.reduce(
                (sum, item) => sum + item[1],
                0
              );

            // --------------------------------------------------------
            // COLORS
            // --------------------------------------------------------

            const accent = "#88C0D0";
            const text = "#C9D1D9";
            const muted = "#6E7681";
            const white = "#FFFFFF";
            const border = "#30363D";

            // --------------------------------------------------------
            // ESCAPE SVG TEXT
            // --------------------------------------------------------

            function escape(text) {
              return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&apos;");
            }

            // ========================================================
            // STATS SVG
            // ========================================================

            const statsSvg = `
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="495"
              height="190"
              viewBox="0 0 495 190"
            >

              <rect
                width="495"
                height="190"
                rx="12"
                fill="#0D1117"
                stroke="${border}"
              />

              <text
                x="25"
                y="38"
                fill="${accent}"
                font-family="Arial, sans-serif"
                font-size="20"
                font-weight="700"
              >
                GitHub Statistics
              </text>

              <line
                x1="25"
                y1="55"
                x2="470"
                y2="55"
                stroke="${border}"
              />

              <text
                x="30"
                y="88"
                fill="${white}"
                font-family="Arial, sans-serif"
                font-size="24"
                font-weight="700"
              >
                ${userData.public_repos}
              </text>

              <text
                x="30"
                y="108"
                fill="${muted}"
                font-family="Arial, sans-serif"
                font-size="12"
              >
                PUBLIC REPOS
              </text>

              <text
                x="165"
                y="88"
                fill="${white}"
                font-family="Arial, sans-serif"
                font-size="24"
                font-weight="700"
              >
                ${stars}
              </text>

              <text
                x="165"
                y="108"
                fill="${muted}"
                font-family="Arial, sans-serif"
                font-size="12"
              >
                STARS EARNED
              </text>

              <text
                x="310"
                y="88"
                fill="${white}"
                font-family="Arial, sans-serif"
                font-size="24"
                font-weight="700"
              >
                ${forks}
              </text>

              <text
                x="310"
                y="108"
                fill="${muted}"
                font-family="Arial, sans-serif"
                font-size="12"
              >
                FORKS
              </text>

              <text
                x="30"
                y="148"
                fill="${text}"
                font-family="Arial, sans-serif"
                font-size="13"
              >
                Followers
              </text>

              <text
                x="120"
                y="148"
                fill="${accent}"
                font-family="Arial, sans-serif"
                font-size="13"
                font-weight="700"
              >
                ${userData.followers}
              </text>

              <text
                x="205"
                y="148"
                fill="${text}"
                font-family="Arial, sans-serif"
                font-size="13"
              >
                Following
              </text>

              <text
                x="290"
                y="148"
                fill="${accent}"
                font-family="Arial, sans-serif"
                font-size="13"
                font-weight="700"
              >
                ${userData.following}
              </text>

              <text
                x="30"
                y="170"
                fill="${muted}"
                font-family="Arial, sans-serif"
                font-size="11"
              >
                github.com/${escape(username)}
              </text>

            </svg>
            `;

            // ========================================================
            // TOP LANGUAGES SVG
            // ========================================================

            let languageRows = "";

            sortedLanguages.forEach(
              ([language, bytes], index) => {

                const percentage =
                  totalBytes > 0
                    ? (bytes / totalBytes) * 100
                    : 0;

                const y =
                  72 + index * 19;

                const barWidth =
                  Math.max(
                    4,
                    percentage * 3.1
                  );

                languageRows += `
                  <text
                    x="25"
                    y="${y}"
                    fill="${text}"
                    font-family="Arial, sans-serif"
                    font-size="12"
                  >
                    ${escape(language)}
                  </text>

                  <rect
                    x="115"
                    y="${y - 10}"
                    width="310"
                    height="7"
                    rx="3"
                    fill="#21262D"
                  />

                  <rect
                    x="115"
                    y="${y - 10}"
                    width="${barWidth}"
                    height="7"
                    rx="3"
                    fill="${accent}"
                  />

                  <text
                    x="438"
                    y="${y}"
                    fill="${muted}"
                    font-family="Arial, sans-serif"
                    font-size="11"
                    text-anchor="end"
                  >
                    ${percentage.toFixed(1)}%
                  </text>
                `;
              }
            );

            const languagesSvg = `
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="495"
              height="190"
              viewBox="0 0 495 190"
            >

              <rect
                width="495"
                height="190"
                rx="12"
                fill="#0D1117"
                stroke="${border}"
              />

              <text
                x="25"
                y="38"
                fill="${accent}"
                font-family="Arial, sans-serif"
                font-size="20"
                font-weight="700"
              >
                Top Languages
              </text>

              <line
                x1="25"
                y1="55"
                x2="470"
                y2="55"
                stroke="${border}"
              />

              ${languageRows}

            </svg>
            `;

            // --------------------------------------------------------
            // WRITE FILES
            // --------------------------------------------------------

            fs.mkdirSync(
              "profile",
              { recursive: true }
            );

            fs.writeFileSync(
              "profile/stats.svg",
              statsSvg
            );

            fs.writeFileSync(
              "profile/top-langs.svg",
              languagesSvg
            );

      - name: Commit statistics
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No statistics changes."
            exit 0
          fi

          git commit -m "📊 update profile statistics"

          git push


  # ================================================================
  # GUESTBOOK
  # ================================================================

  guestbook:
    name: Update Guestbook

    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1 &&
      github.event.issue.pull_request == null

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Guestbook
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |

            const fs = require("fs");

            const owner =
              context.repo.owner;

            const repo =
              context.repo.repo;

            const issueNumber = 1;

            // --------------------------------------------------------
            // FETCH COMMENTS
            // --------------------------------------------------------

            const comments =
              await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: issueNumber,
                  per_page: 100
                }
              );

            // --------------------------------------------------------
            // LATEST 10 COMMENTS
            // --------------------------------------------------------

            const latest =
              comments
                .sort(
                  (a, b) =>
                    new Date(b.updated_at) -
                    new Date(a.updated_at)
                )
                .slice(0, 10);

            // --------------------------------------------------------
            // ESCAPE HTML
            // --------------------------------------------------------

            function escapeHtml(text) {

              return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
            }

            function truncate(
              text,
              length
            ) {

              return text.length > length
                ? text.substring(0, length) + "..."
                : text;
            }

            // --------------------------------------------------------
            // BUILD TABLE
            // --------------------------------------------------------

            let table = `
            <table>
            <tr>
            <th width="25%">NAME</th>
            <th width="20%">DATE</th>
            <th width="55%">MESSAGE</th>
            </tr>
            `;

            if (latest.length === 0) {

              table += `
              <tr>
              <td align="center">✦</td>
              <td align="center">—</td>
              <td>
              <i>
              Be the first to leave a message.
              </i>
              </td>
              </tr>
              `;

            } else {

              for (const comment of latest) {

                const username =
                  escapeHtml(
                    comment.user.login
                  );

                const profile =
                  comment.user.html_url;

                const avatar =
                  comment.user.avatar_url;

                let message =
                  escapeHtml(
                    comment.body
                  );

                message =
                  message
                    .replace(
                      /\r?\n|\r/g,
                      "<br>"
                    )
                    .replace(
                      /\|/g,
                      "&#124;"
                    );

                message =
                  truncate(
                    message,
                    180
                  );

                const date =
                  new Date(
                    comment.updated_at
                  ).toLocaleDateString(
                    "en-GB",
                    {
                      day: "2-digit",
                      month: "short",
                      year: "numeric"
                    }
                  );

                table += `
                <tr>
                <td align="center"><a href="${profile}"><img src="${avatar}" width="32" height="32" alt="${username}"><br><b>${username}</b></a></td>
                <td align="center">${date}</td>
                <td>${message}</td>
                </tr>
                `;
              }
            }

            table += `
            </table>
            `;

            // --------------------------------------------------------
            // READ README
            // --------------------------------------------------------

            const readme =
              fs.readFileSync(
                "README.md",
                "utf8"
              );

            // --------------------------------------------------------
            // REPLACE GUESTBOOK
            // --------------------------------------------------------

            const marker =
              /<!-- Guestbook -->[\s\S]*?<!-- \/Guestbook -->/;

            if (!marker.test(readme)) {

              core.setFailed(
                "Guestbook markers were not found."
              );

              return;
            }

            const updated =
              readme.replace(
                marker,
                `<!-- Guestbook -->

${table}

<!-- /Guestbook -->`
              );

            // --------------------------------------------------------
            // WRITE README
            // --------------------------------------------------------

            fs.writeFileSync(
              "README.md",
              updated,
              "utf8"
            );

      - name: Commit Guestbook
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No guestbook changes."
            exit 0
          fi

          git commit -m "✦ update guestbook"

          git push
